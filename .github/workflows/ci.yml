name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit + integration + regression tests
        run: npx vitest run --reporter=dot
      - name: Build game bundle
        run: npx tsx tools/build-game.ts
      - name: Headless QA smoke (shipped pack, 2 seeds)
        run: npx tsx tools/qa-smoke.ts
